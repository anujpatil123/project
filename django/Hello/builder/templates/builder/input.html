{% load static %}

<!DOCTYPE html>
<html>
<head>
 


 <style>
/* Enhanced Form Interface with Modern Animations */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --primary-color: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #8b5cf6;
  --secondary-color: #ec4899;
  --accent-color: #06b6d4;
  --success-color: #10b981;
  --warning-color: #f59e0b;
  --error-color: #ef4444;
  --background-primary: #0f0f23;
  --background-secondary: #1a1a2e;
  --surface-color: #16213e;
  --text-primary: #ffffff;
  --text-secondary: #94a3b8;
  --border-color: #334155;
  --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
  --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
  --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-bounce: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, 
    var(--background-primary) 0%, 
    var(--background-secondary) 50%, 
    #0f172a 100%);
  min-height: 100vh;
  padding: 20px;
  margin: 0;
  color: var(--text-primary);
  overflow-x: hidden;
  position: relative;
}

/* Add the stars element to DOM dynamically */
body {
  background-attachment: fixed;
}

/* Create the stars container */
.stars-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

/* Geometric shapes floating animation */
.floating-shapes::before,
.floating-shapes::after {
  content: '';
  position: fixed;
  pointer-events: none;
  z-index: -1;
}

.floating-shapes::before {
  top: 20%;
  left: 10%;
  width: 60px;
  height: 60px;
  background: linear-gradient(45deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
  border-radius: 30%;
  animation: floatShape1 15s ease-in-out infinite;
}

.floating-shapes::after {
  top: 60%;
  right: 15%;
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
  border-radius: 50%;
  animation: floatShape2 18s ease-in-out infinite reverse;
}

@keyframes floatShape1 {
  0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
  25% { transform: translateY(-30px) rotate(90deg) scale(1.1); }
  50% { transform: translateY(-15px) rotate(180deg) scale(0.9); }
  75% { transform: translateY(-25px) rotate(270deg) scale(1.05); }
}

@keyframes floatShape2 {
  0%, 100% { transform: translateX(0px) rotate(0deg) scale(1); }
  33% { transform: translateX(25px) rotate(120deg) scale(1.2); }
  66% { transform: translateX(-15px) rotate(240deg) scale(0.8); }
}

/* Animated background particles */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 40% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
  animation: backgroundFloat 20s ease-in-out infinite;
  pointer-events: none;
  z-index: -1;
}

/* Additional floating orbs */
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    radial-gradient(circle at 70% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 30% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 50%, rgba(245, 158, 11, 0.08) 0%, transparent 40%);
  animation: backgroundFloat2 25s ease-in-out infinite reverse;
  pointer-events: none;
  z-index: -1;
}

@keyframes backgroundFloat {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  33% { transform: translateY(-20px) rotate(1deg); }
  66% { transform: translateY(10px) rotate(-1deg); }
}

@keyframes backgroundFloat2 {
  0%, 100% { transform: translateX(0px) rotate(0deg) scale(1); }
  25% { transform: translateX(10px) rotate(0.5deg) scale(1.1); }
  50% { transform: translateX(-5px) rotate(-0.5deg) scale(0.9); }
  75% { transform: translateX(8px) rotate(0.3deg) scale(1.05); }
}

/* Twinkling stars effect */
.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.stars::before,
.stars::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  box-shadow:
    100px 200px 0 rgba(255, 255, 255, 0.6),
    300px 100px 0 rgba(99, 102, 241, 0.8),
    500px 300px 0 rgba(236, 72, 153, 0.6),
    700px 150px 0 rgba(6, 182, 212, 0.8),
    200px 400px 0 rgba(139, 92, 246, 0.6),
    800px 350px 0 rgba(255, 255, 255, 0.7),
    150px 50px 0 rgba(16, 185, 129, 0.6),
    650px 250px 0 rgba(245, 158, 11, 0.8),
    400px 450px 0 rgba(255, 255, 255, 0.5),
    900px 100px 0 rgba(99, 102, 241, 0.6);
  animation: twinkle 3s ease-in-out infinite alternate;
}

.stars::after {
  box-shadow:
    120px 180px 0 rgba(255, 255, 255, 0.7),
    320px 120px 0 rgba(236, 72, 153, 0.8),
    520px 320px 0 rgba(6, 182, 212, 0.6),
    720px 170px 0 rgba(99, 102, 241, 0.8),
    220px 420px 0 rgba(139, 92, 246, 0.7),
    820px 370px 0 rgba(255, 255, 255, 0.6),
    170px 70px 0 rgba(16, 185, 129, 0.8),
    670px 270px 0 rgba(245, 158, 11, 0.6),
    420px 470px 0 rgba(255, 255, 255, 0.7),
    920px 120px 0 rgba(236, 72, 153, 0.6);
  animation: twinkle 4s ease-in-out infinite alternate-reverse;
}

@keyframes twinkle {
  0% { opacity: 0.3; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}

/* Enhanced heading with gradient animation */
h2 {
  text-align: center;
  background: linear-gradient(
    45deg,
    var(--primary-color),
    var(--secondary-color),
    var(--accent-color),
    var(--primary-light)
  );
  background-size: 300% 300%;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 2rem;
  animation: gradientShift 4s ease-in-out infinite, titleFloat 3s ease-in-out infinite;
  letter-spacing: -0.02em;
  text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes titleFloat {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

/* Enhanced form with glassmorphism effect */
form {
  max-width: 700px;
  margin: 20px auto;
  padding: 40px;
  background: rgba(22, 33, 62, 0.8);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  box-shadow: 
    var(--shadow-soft),
    var(--shadow-glow),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: formSlideIn 1s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

/* Animated border glow */
form::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  background: linear-gradient(
    45deg,
    var(--primary-color),
    var(--secondary-color),
    var(--accent-color),
    var(--primary-light)
  );
  background-size: 300% 300%;
  border-radius: 26px;
  z-index: -1;
  animation: borderGlow 3s ease-in-out infinite;
  opacity: 0.7;
}

@keyframes borderGlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes formSlideIn {
  from {
    opacity: 0;
    transform: translateY(60px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Enhanced labels with animation */
label {
  font-weight: 600;
  display: block;
  margin-top: 25px;
  margin-bottom: 8px;
  color: var(--text-primary);
  font-size: 1.1rem;
  position: relative;
  animation: labelSlideIn 0.6s ease-out backwards;
}

label::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 0;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  border-radius: 2px;
  transition: var(--transition-smooth);
}

label:hover::before {
  height: 100%;
}

@keyframes labelSlideIn {
  from {
    opacity: 0;
    transform: translateX(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Enhanced input fields */
input[type="text"],
textarea,
input[type="file"] {
  width: 100%;
  padding: 15px 20px;
  margin-top: 8px;
  margin-bottom: 20px;
  border: 2px solid var(--border-color);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  font-size: 1rem;
  font-family: inherit;
  transition: var(--transition-smooth);
  position: relative;
  animation: inputSlideIn 0.8s ease-out backwards;
}

input[type="text"]::placeholder,
textarea::placeholder {
  color: var(--text-secondary);
  transition: var(--transition-smooth);
}

input[type="text"]:focus,
textarea:focus {
  border-color: var(--primary-color);
  background: rgba(99, 102, 241, 0.1);
  box-shadow: 
    0 0 20px rgba(99, 102, 241, 0.3),
    0 0 40px rgba(99, 102, 241, 0.1);
  outline: none;
  transform: translateY(-2px);
}

input[type="text"]:focus::placeholder,
textarea:focus::placeholder {
  color: rgba(148, 163, 184, 0.7);
  transform: translateY(-2px);
}

@keyframes inputSlideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Enhanced textarea */
textarea {
  min-height: 120px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.6;
}

/* File input styling */
input[type="file"] {
  padding: 20px;
  border: 2px dashed var(--border-color);
  background: rgba(255, 255, 255, 0.02);
  cursor: pointer;
  transition: var(--transition-smooth);
}

input[type="file"]:hover {
  border-color: var(--primary-color);
  background: rgba(99, 102, 241, 0.05);
  transform: translateY(-2px);
}

/* Enhanced buttons with multiple effects */
button,
input[type="submit"] {
  background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
  color: var(--text-primary);
  padding: 15px 30px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  font-size: 1.1rem;
  font-family: inherit;
  transition: var(--transition-bounce);
  margin-top: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 4px 15px rgba(99, 102, 241, 0.4),
    0 0 20px rgba(99, 102, 241, 0.2);
  animation: buttonSlideIn 1s ease-out backwards;
}

/* Button shine effect */
button::before,
input[type="submit"]::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.2),
    transparent
  );
  transition: left 0.5s ease;
}

button:hover::before,
input[type="submit"]:hover::before {
  left: 100%;
}

button:hover,
input[type="submit"]:hover {
  background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
  transform: translateY(-5px) scale(1.05);
  box-shadow: 
    0 8px 25px rgba(236, 72, 153, 0.4),
    0 0 30px rgba(236, 72, 153, 0.3);
}

button:active,
input[type="submit"]:active {
  transform: translateY(-2px) scale(1.02);
}

@keyframes buttonSlideIn {
  from {
    opacity: 0;
    transform: translateY(30px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Staggered animation delays */
label:nth-child(1) { animation-delay: 0.1s; }
label:nth-child(3) { animation-delay: 0.2s; }
label:nth-child(5) { animation-delay: 0.3s; }
label:nth-child(7) { animation-delay: 0.4s; }

input:nth-child(2) { animation-delay: 0.15s; }
input:nth-child(4) { animation-delay: 0.25s; }
input:nth-child(6) { animation-delay: 0.35s; }
input:nth-child(8) { animation-delay: 0.45s; }

textarea:nth-child(4) { animation-delay: 0.25s; }
textarea:nth-child(6) { animation-delay: 0.35s; }

button { animation-delay: 0.6s; }
input[type="submit"] { animation-delay: 0.6s; }

/* Floating elements animation */
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
}

/* Add floating particles */
form::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--accent-color);
  border-radius: 50%;
  top: 20%;
  right: 10%;
  animation: float 4s ease-in-out infinite;
  box-shadow: 
    0 0 10px var(--accent-color),
    20px 30px 0 -2px var(--secondary-color),
    -30px 50px 0 -2px var(--primary-color);
}

/* Responsive design */
@media (max-width: 768px) {
  body {
    padding: 10px;
  }
  
  h2 {
    font-size: 2.5rem;
  }
  
  form {
    padding: 30px 20px;
    margin: 10px auto;
  }
  
  input[type="text"],
  textarea,
  input[type="file"] {
    padding: 12px 15px;
  }
  
  button,
  input[type="submit"] {
    padding: 12px 25px;
    font-size: 1rem;
  }
}

/* Success state animation */
.success-state {
  animation: successPulse 0.6s ease-out;
}

@keyframes successPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); box-shadow: 0 0 30px var(--success-color); }
  100% { transform: scale(1); }
}
</style>

</head>

</html>
